# 桌面版打包配置。
# 产物结构与网页端解耦：renderer/ 由 `pnpm --filter 4enext-web build:desktop` 生成，不进版本库。
appId: ltd.banque.4enext
productName: 4E NEXT
copyright: Copyright © 4E NEXT contributors · MPL-2.0

directories:
  output: release
  buildResources: build

# Electron 运行时不用 electron-builder 自己去下，直接用仓库根的 .electron-cache/ 里那个 zip。
#
# 为什么：electron-builder 取运行时压缩包（158MB）用的是 10 分钟请求超时，而且失败会重试 3 次。
# 实测直连 GitHub Releases 卡到 "Timeout awaiting 'request' for 600000ms"（连续两次构建都死在这），
# 换 npmmirror 虽然连得上，但被限速到 0.08 MB/s——158MB 要跑半个多小时，照样超时。
# 更要命的是 electron-builder 不认 `electronDownload.cache` / `.checksums`
# （这两个键在 ElectronGetOptions 里被 Omit 掉了，写了也是静默忽略），
# 所以没法用「自带校验和 + 本地缓存」那条路。
#
# electronDist 指到 zip 是官方支持的形态（见 ElectronFramework.unpack 的 selectElectron）：
# 直接把 zip 解到输出目录，不发任何请求，也不再重复解压一次。
# zip 由 `npm --prefix desktop run fetch-electron` 抓取并校验 sha256 后落在这里，不进版本库。
electronDist: ../.electron-cache/electron-v44.4.1-win32-x64.zip

files:
  - main/**/*
  - preload/**/*
  - renderer/**/*
  - package.json

asar: true

win:
  # Electron 自带 55 种语言包，每个约 0.9MB。本应用界面只有中文（英文作为 Chromium 的兜底回退），
  # 其余 53 种纯属白占体积——装完省约 46MB。
  electronLanguages:
    - zh-CN
    - en-US
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: 4E-NEXT-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 4E NEXT
  # 卸载时保留用户数据（人物卡/私设都在里面），避免升级或重装丢卡
  deleteAppDataOnUninstall: false

# 测试版：只出 Windows x64 安装包
publish: null
