<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      正文字体的加载：先 rel="preload" 提前取，再由 src/main.tsx 切成样式表。
      原先写的是 onload="this.rel='stylesheet'"——那是内联事件处理器，会被 CSP 的
      script-src 'self' 直接拦掉，所以改成脚本侧切换（两段都在 CSP 允许范围内）。
      桌面端构建会把这行整条剔除（字体已内置），main.tsx 里的查询自然落空，不会请求 CDN。
    -->
    <link data-font-preload href="https://fontsapi.zeoseven.com/546/main/result.css" rel="preload" as="style" crossorigin referrerpolicy="no-referrer" />
    <noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/546/main/result.css" referrerpolicy="no-referrer" /></noscript>
    <title>4E NEXT</title>
    <!--
      静态启动屏：JS 还没下载完的那段时间（跨境链路上可能是几十秒）原来是一张白页。
      这段标记与样式内联在 HTML 里，随首个响应一起到达，不需要等 JS/CSS 包。
      之后由 src/boot/BootOverlay.tsx 接管或移除它。
      约束：不能写内联 <script>（CSP 只有 script-src 'self'），所以「网络较慢」的提示
      用 CSS animation-delay 实现 —— 纯样式也能表达「等了很久」。
    -->
    <style>
      #4e-boot {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fef7ff;
        color: #1d1b20;
        font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      }
      #4e-boot .b-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 320px;
      }
      #4e-boot .b-brand {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6750a4;
      }
      #4e-boot .b-headline {
        margin: 0;
        font-size: 22px;
        line-height: 1.3;
        font-weight: 600;
      }
      #4e-boot .b-track {
        position: relative;
        height: 4px;
        margin-top: 4px;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(103, 80, 164, 0.16);
      }
      #4e-boot .b-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 9999px;
        background: #6750a4;
        animation: b-slide 1.6s cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      #4e-boot .b-caption {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #49454f;
      }
      #4e-boot .b-hint {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #49454f;
        opacity: 0;
        animation: b-fade 0.4s linear 10s forwards;
      }
      @keyframes b-slide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
      @keyframes b-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        #4e-boot {
          background: #141218;
          color: #e6e0e9;
        }
        #4e-boot .b-brand,
        #4e-boot .b-bar {
          color: #d0bcff;
          background-color: #d0bcff;
        }
        #4e-boot .b-track {
          background: rgba(208, 188, 255, 0.16);
        }
        #4e-boot .b-caption,
        #4e-boot .b-hint {
          color: #cac4d0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #4e-boot .b-bar {
          animation: none;
          left: 30%;
        }
        #4e-boot .b-hint {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="4e-boot" role="status" aria-live="polite">
      <div class="b-panel">
        <div class="b-brand">4E NEXT</div>
        <p class="b-headline">正在打开车卡器</p>
        <div class="b-track"><div class="b-bar"></div></div>
        <p class="b-caption">首次打开需要下载卡表，之后就快了。</p>
        <p class="b-hint">网络较慢，仍在下载，请稍候…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
