name: Android Release

# 安卓发布流水线。
#
# 与桌面版一致：**打 tag 才出包**，push 到 main 不触发。
#   git tag -a "4E-NEXT-Android-V0.3.4" -m "4E NEXT 安卓版 0.3.4"
#   git push origin "4E-NEXT-Android-V0.3.4"
#
# 也可以手动触发（workflow_dispatch），只出 artifact 不建 Release——
# 用来在真机验证前先拿一个包。
#
# 需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#   ANDROID_KEYSTORE_BASE64    keystore 文件的 base64
#   ANDROID_KEYSTORE_PASSWORD  keystore 口令
#   ANDROID_KEY_ALIAS          key 别名
#   ANDROID_KEY_PASSWORD       key 口令
#
# **打 tag 发布必须配齐这四个**，否则「出包」那一步会直接失败
# （--require-release-signing：宁可不发，也不发一个 debug 签名的包）。
# 手动触发不要求，但没配时仍会回落到 debug 签名——那种包只能自测，**不能用于正式分发**。
#
# keystore 转 base64：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("4enext-release.jks"))

on:
  push:
    tags:
      - "4E-NEXT-Android-V*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # AGP 8.13 的最低要求是 JDK 17。ubuntu-latest 自带 Android SDK，
      # 这里只装 JDK，不引第三方 setup-android（少一个供应链面）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 与网页端部署同一条守卫：确认 android/ 没被误加进 pnpm workspace
      - name: "Guard: desktop/android not in pnpm workspace"
        run: node scripts/verify-workspace.mjs

      # 守卫：gradlew 必须带可执行位。
      #
      # git 只记录 100644 / 100755 两种模式，而从 Windows 提交时 100755 很容易丢掉
      # （本地用 gradlew.bat 构建一切正常，完全看不出来）。到了 Linux runner 上
      # `./gradlew` 直接 Permission denied，而且**失败得极快**——整个 run 只有一行
      # exit code 1，看不出是哪一步的什么问题。2026-10-07 的 0.3.4 首次出包就栽在这里。
      - name: "Guard: android/gradlew is executable"
        run: |
          mode=$(git ls-files -s android/gradlew | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::android/gradlew 在 git 里的模式是 $mode，应为 100755。"
            echo "修法：git update-index --chmod=+x android/gradlew && git commit"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data pipeline
        run: pnpm pipeline

      # keystore 只在 runner 内存/磁盘上存在，跑完即随 runner 销毁；不进仓库
      #
      # 判空**不能**写成 `if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}`：
      # `jobs.<job_id>.steps.if` 可用的上下文只有
      # github / needs / strategy / matrix / job / runner / env / vars / steps / inputs，
      # 不含 secrets。写进去会让整个 workflow 文件校验不过，
      # 于是**任何触发方式**都在启动阶段失败——run 建出来了，但一个 job 都没有。
      # env 是允许 secrets 的，所以改成用 env 传进来、在脚本里判空。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，跳过 keystore 还原；"
            echo "本次将产出 debug 签名包，**不可用于正式分发**。"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      # 出包：脚本会自己构建 web 产物、跑 gradlew、复制 APK、算 SHA256、验签名
      #
      # 打 tag 时加 --require-release-signing：**没配 Secrets 就直接失败**，
      # 而不是照常建一个带 debug 签名包的 Release。理由见 android/SIGNING.md 第四节，
      # 以及 make-release.mjs 里那个开关的注释——debug 签名的包发出去，
      # 用户之后无法用正式密钥覆盖安装（只能卸载，而卸载会删掉应用私有目录里的卡）。
      # workflow_dispatch 不加这个开关：它本来就是"真机验证前先拿个包"的自测通道。
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'keystore/release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node android/scripts/make-release.mjs ${{ startsWith(github.ref, 'refs/tags/') && '--require-release-signing' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: 4e-next-android-apk
          path: |
            android/release/*.apk
            android/release/SHA256SUMS.txt

      # 建 Release 并上传附件。复用桌面端那个脚本（--release-dir 换目录），
      # 于是"复用已存在的 Release、跳过已传过的附件"这套续传逻辑两端共用。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node desktop/scripts/create-release.mjs \
            --release-dir android/release \
            --tag "${GITHUB_REF_NAME}" \
            --title "4E NEXT 安卓版（${GITHUB_REF_NAME}）" \
            --notes-file android/RELEASE-NOTES.md
