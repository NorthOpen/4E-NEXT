name: Android Release

# 安卓发布流水线。
#
# 与桌面版一致：**打 tag 才出包**，push 到 main 不触发。
#   git tag -a "4E-NEXT-Android-V0.3.4" -m "4E NEXT 安卓版 0.3.4"
#   git push origin "4E-NEXT-Android-V0.3.4"
#
# 也可以手动触发（workflow_dispatch），只出 artifact 不建 Release——
# 用来在真机验证前先拿一个包。
#
# 需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#   ANDROID_KEYSTORE_BASE64    keystore 文件的 base64
#   ANDROID_KEYSTORE_PASSWORD  keystore 口令
#   ANDROID_KEY_ALIAS          key 别名
#   ANDROID_KEY_PASSWORD       key 口令
# 没有这些 Secrets 时仍会出包，但用的是 debug 签名——**不能用于正式分发**。
#
# keystore 转 base64：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("4enext-release.jks"))

on:
  push:
    tags:
      - "4E-NEXT-Android-V*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # AGP 8.13 的最低要求是 JDK 17。ubuntu-latest 自带 Android SDK，
      # 这里只装 JDK，不引第三方 setup-android（少一个供应链面）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 与网页端部署同一条守卫：确认 android/ 没被误加进 pnpm workspace
      - name: "Guard: desktop/android not in pnpm workspace"
        run: node scripts/verify-workspace.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data pipeline
        run: pnpm pipeline

      # keystore 只在 runner 内存/磁盘上存在，跑完即随 runner 销毁；不进仓库
      #
      # 判空**不能**写成 `if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}`：
      # `jobs.<job_id>.steps.if` 可用的上下文只有
      # github / needs / strategy / matrix / job / runner / env / vars / steps / inputs，
      # 不含 secrets。写进去会让整个 workflow 文件校验不过，
      # 于是**任何触发方式**都在启动阶段失败——run 建出来了，但一个 job 都没有。
      # env 是允许 secrets 的，所以改成用 env 传进来、在脚本里判空。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，跳过 keystore 还原；"
            echo "本次将产出 debug 签名包，**不可用于正式分发**。"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks

      # 出包：脚本会自己构建 web 产物、跑 gradlew、复制 APK、算 SHA256、验签名
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'keystore/release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node android/scripts/make-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: 4e-next-android-apk
          path: |
            android/release/*.apk
            android/release/SHA256SUMS.txt

      # 建 Release 并上传附件。复用桌面端那个脚本（--release-dir 换目录），
      # 于是"复用已存在的 Release、跳过已传过的附件"这套续传逻辑两端共用。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node desktop/scripts/create-release.mjs \
            --release-dir android/release \
            --tag "${GITHUB_REF_NAME}" \
            --title "4E NEXT 安卓版（${GITHUB_REF_NAME}）" \
            --notes-file android/RELEASE-NOTES.md
